<!-- Bot protection for the iPhone app (readiness #11, 14 November 2026). The app opens this page with the Cloudflare
     Turnstile site key (?k=…) and sends the answer back to itself as shiyaka://auth/captcha?token=…. Nothing about the
     person is read or stored here; Cloudflare sees the connection like any website. -->

<p id="lead">This takes a moment and keeps bots out of Shyaka.</p>
<div id="widget"></div>
<p id="done" hidden>Done. Going back to Shyaka…</p>
<p id="bad" hidden>This page needs to be opened from the Shyaka app.</p>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var key = (q.get("k") || "").trim();
  var lang = q.get("lang") === "ar" ? "ar" : "en";
  if (lang === "ar") {
    document.documentElement.lang = "ar-EG"; document.documentElement.dir = "rtl";
    document.getElementById("title").textContent = "تأكيد سريع";
    document.getElementById("lead").textContent = "ثانية واحدة وبنمنع البوتات من شياكة.";
    document.getElementById("done").textContent = "تمام. بنرجّعك لشياكة…";
    document.getElementById("bad").textContent = "الصفحة دي لازم تتفتح من تطبيق شياكة.";
  }
  if (!/^[0-9A-Za-z_-]{10,100}$/.test(key)) { document.getElementById("bad").hidden = false; document.getElementById("lead").hidden = true; return; }
  window.onloadTurnstileCallback = function () {
    turnstile.render("#widget", {
      sitekey: key,
      language: lang,
      callback: function (token) {
        document.getElementById("done").hidden = false;
        // Only ever back to the app's own address; the token is single-use and expires in five minutes.
        window.location.href = "shiyaka://auth/captcha?token=" + encodeURIComponent(token);
      }
    });
  };
  var wait = setInterval(function () { if (window.turnstile) { clearInterval(wait); window.onloadTurnstileCallback(); } }, 100);
})();
</script>
